      examples:
        - playerId: ivan-delantero
          playerName: Ivan Delantero
          date: "2000-10-21"
          daysOut: 14

    BlockSummary:
      type: object
      description: >-
        What happened in a simulated block: results (with extra time and penalties), key matches,
        standings, events and injuries.
      required: [blockNumber, label, results, standings, events, injuries]
      additionalProperties: false
      properties:
        keyStarterOutcome:
          description: Optional for legacy replies; null when no selection was applied.
          oneOf:
            - $ref: "#/components/schemas/KeyStarterOutcome"
            - type: "null"
        blockNumber:
          type: integer
          minimum: 1
        label:
          type: string
          description: Period covered by the block.
        results:
          type: array
          items:
            $ref: "#/components/schemas/MatchReport"
        standings:
          type: array
          items:
            $ref: "#/components/schemas/Standings"
        events:
          type: array
          items:
            $ref: "#/components/schemas/BlockEvent"
        injuries:
          type: array
          items:
            $ref: "#/components/schemas/InjuryReport"
      examples:
        - blockNumber: 1
          label: August
          results:
            - fixtureId: tfc-rovers-md7
              competitionId: liga-test
              competitionName: Liga Test
              round: Matchday 7
              date: "2000-10-14"
              home:
                clubSeasonId: test-fc-2000-01
                name: Test FC
                shortName: TFC
                colors:
                  primary: "#1d4ed8"
                  secondary: "#f8fafc"
                isUser: true
              away:
                clubSeasonId: rovers-prueba-2000-01
                name: Rovers Prueba
                shortName: ROV
                colors:
                  primary: "#b91c1c"
                  secondary: "#fde68a"
                isUser: false
              homeGoals: 2
              awayGoals: 1
              extraTime: null
              penalties: null
              venue: home
              isKeyMatch: true
              keyMatchLabel: Derby
              userResult: win
          standings:
            - competitionId: liga-test
              competitionName: Liga Test
              rows:
                - position: 1
                  previousPosition: null
                  team:
                    clubSeasonId: test-fc-2000-01
                    name: Test FC
                    shortName: TFC
                    colors:
                      primary: "#1d4ed8"
                      secondary: "#f8fafc"
                    isUser: true
                  played: 10
                  won: 7
                  drawn: 2
                  lost: 1
                  goalsFor: 21
                  goalsAgainst: 8
                  points: 23
          events:
            - kind: milestone
              date: "2000-11-04"
              text: Test FC reaches the top of the table.
          injuries: []

    RunView:
      type: object
      description: >-
        Everything the client needs to render a run. It never contains the seed, option effects or
        the historical option of a dilemma.
      required:
        - runId
        - seasonId
        - status
        - version
        - block
        - pendingDilemmas
        - decisions
        - state
        - squad
        - tactic
        - competitionPriorities
        - lastBlockSummary
        - sackedMonth
      additionalProperties: false
      properties:
        keyStarter:
          description: Optional for legacy replies; null means no interaction in this block.
          oneOf:
            - $ref: "#/components/schemas/KeyStarterOffer"
            - type: "null"
        runId:
          type: string
          format: uuid
        seasonId:
          $ref: "#/components/schemas/Slug"
        status:
          $ref: "#/components/schemas/RunStatus"
        version:
          type: integer
          minimum: 0
          description: Optimistic-locking version, incremented by every command.
        block:
          $ref: "#/components/schemas/BlockProgress"
        pendingDilemmas:
          type: array
          description: Dilemmas of the current block still to be decided.
          items:
            $ref: "#/components/schemas/Dilemma"
        decisions:
          type: array
          description: Decisions taken so far, oldest first.
          items:
            $ref: "#/components/schemas/Decision"
        state:
          $ref: "#/components/schemas/TeamState"
        squad:
          $ref: "#/components/schemas/SquadStatus"
        tactic:
          $ref: "#/components/schemas/Tactic"
        competitionPriorities:
          type: array
          description: Current priority of every competition of the season.
          items:
            $ref: "#/components/schemas/CompetitionPriority"
        lastBlockSummary:
          oneOf:
            - $ref: "#/components/schemas/BlockSummary"
            - type: "null"
          description: Summary of the last simulated block, or null before the first one.
        sackedMonth:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 12
          description: Calendar month in which the manager was sacked, or null otherwise.
      examples:
        - runId: 0b6f3a52-6c0e-4d3e-8d0a-3f1f6e2b9c11
          seasonId: test-fc-2000-01
          status: in_progress
          version: 0
          block:
            number: 1
            total: 5
            label: August
          pendingDilemmas:
            - id: summer-striker
              title: Summer striker
              prompt: The board offers a budget for one striker. Who do you want?
              options:
                - id: sign-the-veteran
                  label: Sign the veteran striker
                - id: promote-the-youth
                  label: Promote the academy striker
          decisions: []
          state:
            morale: 70
            boardConfidence: 65
            fitness: 90
          squad:
            size: 1
            averageRating: 84
            players:
              - id: ivan-delantero
                displayName: Ivan Delantero
                position: FW
                age: 27
                rating: 84
                key: true
                morale: 72
                fitness: 91
                injury: null
          tactic:
            style: balanced
            system: 4-4-2
          competitionPriorities:
            - competitionId: liga-test
              priority: normal
          lastBlockSummary: null
          sackedMonth: null

    TacticStyle:
      type: string
      description: Playing style.
      enum: [pressing, counter, possession, balanced]
      examples: [balanced]

    Tactic:
      type: object
      description: Current tactic of the team.
      required: [style, system]
      additionalProperties: false
      properties:
        style:
          $ref: "#/components/schemas/TacticStyle"
        system:
          type: string
          description: >-
            Formation as 3 to 5 lines separated by hyphens, for example `4-4-2` or `4-1-2-1-2`.
            The regex only checks the shape; the rules that do not fit in it are that every line
            has between 1 and 6 players and that the lines add up to 10 (the goalkeeper is not
            counted).
          pattern: "^[1-9](-[1-9]){2,4}$"
      examples:
        - style: balanced
          system: 4-4-2

    CompetitionPriorityLevel:
      type: string
      description: How much the squad is rotated in a competition against the others.
      enum: [low, normal, high]
      examples: [normal]

    CompetitionPriority:
      type: object
      description: The priority given to one competition.
      required: [competitionId, priority]
      additionalProperties: false
      properties:
        competitionId:
          $ref: "#/components/schemas/Slug"
        priority:
          $ref: "#/components/schemas/CompetitionPriorityLevel"
      examples:
        - competitionId: liga-test
          priority: normal

    KnockoutRound:
      type: string
      description: Stage of a knockout competition, from the earliest to the latest.
      enum:
        - qualifying
        - playoff
        - group_stage
        - round_of_128
        - round_of_64
        - round_of_32
        - round_of_16
        - quarter_final
        - semi_final
        - final
      examples: [semi_final]

    Placement:
      type: object
      description: >-
        How a team ended a competition. For cups `finish` and `round` (furthest stage reached)
        are what matters; for leagues, `position`.
      required: [finish, round, stageName, position]
      additionalProperties: false
      properties:
        finish:
          type: string
          description: Outcome of the competition.
          enum: [champion, runner_up, eliminated]
        round:
          oneOf:
            - $ref: "#/components/schemas/KnockoutRound"
            - type: "null"
          description: Furthest stage reached in a cup. Null for leagues.
        stageName:
          type:
            - string
            - "null"
          description: Localised name of that stage. Null for leagues.
        position:
          type:
            - integer
            - "null"
          minimum: 1
          description: Final league position. Null for cups.
      examples:
        - finish: champion
          round: final
          stageName: Final
          position: null

    CompetitionComparison:
      type: object
      description: The player's outcome in a competition against the real history.
      required: [competitionId, competitionName, kind, user, historical]
      additionalProperties: false
      properties:
        competitionId:
          $ref: "#/components/schemas/Slug"
        competitionName:
          type: string
        kind:
          $ref: "#/components/schemas/CompetitionKind"
        user:
          $ref: "#/components/schemas/Placement"
        historical:
          $ref: "#/components/schemas/Placement"
      examples:
        - competitionId: liga-test
          competitionName: Liga Test
          kind: league
          user:
            finish: champion
            round: null
            stageName: null
            position: 1
          historical:
            finish: runner_up
            round: null
            stageName: null
            position: 2

    LeaguePosition:
      type: object
      description: Final league position of the player against the real one.
      required: [user, historical]
      additionalProperties: false
      properties:
        user:
          type: integer
          minimum: 1
        historical:
          type: integer
          minimum: 1
      examples:
        - user: 1
          historical: 2

    VerdictKind:
      type: string
      description: Category of the verdict.
      enum: [surpassed_history, matched_history, below_history, sacked]
      examples: [surpassed_history]

    Verdict:
      type: object
      description: Final sentence of the run.
      required: [kind, text]
      additionalProperties: false
      properties:
        kind:
          $ref: "#/components/schemas/VerdictKind"
        text:
          type: string
          description: Localised text shown to the player.
      examples:
        - kind: surpassed_history
          text: You surpassed Ramon Prueba.

    RunResult:
      type: object
      description: Final result of a finished or sacked run, compared with the real history.
      required:
        - runId
        - seasonId
        - status
        - historicalManager
        - comparisons
        - leaguePosition
        - misterScore
        - verdict
        - percentile
        - sackedMonth
        - alias
        - shareUrl
        - ogImageUrl
      additionalProperties: false
      properties:
        runId:
          type: string
          format: uuid
        seasonId:
          $ref: "#/components/schemas/Slug"
        status:
          type: string
          enum: [finished, sacked]
        historicalManager:
          type: string
          description: Name of the real manager of that season.
        comparisons:
          type: array
          description: Outcome per competition against the real history.
          items:
            $ref: "#/components/schemas/CompetitionComparison"
        leaguePosition:
          oneOf:
            - $ref: "#/components/schemas/LeaguePosition"
            - type: "null"
          description: Final league position against the real one. Null when the run was sacked.
        misterScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Mister score from 0 to 100.
        verdict:
          $ref: "#/components/schemas/Verdict"
        percentile:
          type: number
          minimum: 0
          maximum: 100
          description: Percentage of players this run beat.
        sackedMonth:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 12
          description: Calendar month in which the manager was sacked, or null otherwise.
        alias:
          type:
            - string
            - "null"
          description: Alias the run was published under, or null if it was not published.
        shareUrl:
          type: string
          format: uri
          description: Absolute URL of the public page `/r/{runId}`, which is not part of this API.
        ogImageUrl:
          type: string
          format: uri
          description: Absolute URL of the share image `/og/{runId}.png`, which is not part of this API.
      examples:
        - runId: 0b6f3a52-6c0e-4d3e-8d0a-3f1f6e2b9c11
          seasonId: test-fc-2000-01
          status: finished
          historicalManager: Ramon Prueba
          comparisons:
            - competitionId: liga-test
              competitionName: Liga Test
              kind: league
              user:
                finish: champion
                round: null
                stageName: null
                position: 1
              historical:
                finish: runner_up
                round: null
                stageName: null
                position: 2
          leaguePosition:
            user: 1
            historical: 2
          misterScore: 78
          verdict:
            kind: surpassed_history
            text: You surpassed Ramon Prueba.
          percentile: 87.5
          sackedMonth: null
          alias: null
          shareUrl: https://misterhistorico.example/r/0b6f3a52-6c0e-4d3e-8d0a-3f1f6e2b9c11
          ogImageUrl: https://misterhistorico.example/og/0b6f3a52-6c0e-4d3e-8d0a-3f1f6e2b9c11.png

    LeaderboardEntry:
      type: object
      description: A published run in the leaderboard.
      required: [rank, alias, misterScore, verdictKind, finishedAt, shareUrl]
      additionalProperties: false
      properties:
        rank:
          type: integer
          minimum: 1
          description: One-based position in the season leaderboard.
        alias:
          type: string
          minLength: 3
          maxLength: 20
        misterScore:
          type: integer
          minimum: 0
          maximum: 100
        verdictKind:
          $ref: "#/components/schemas/VerdictKind"
        finishedAt:
          type: string
          format: date-time
        shareUrl:
          type: string
          format: uri
          description: Absolute URL of the public page of that run.
      examples:
        - rank: 1
          alias: Mister Test
          misterScore: 78
          verdictKind: surpassed_history
          finishedAt: "2026-10-22T10:15:00Z"
          shareUrl: https://misterhistorico.example/r/0b6f3a52-6c0e-4d3e-8d0a-3f1f6e2b9c11

    LeaderboardPage:
      type: object
      description: One page of a season leaderboard.
      required: [seasonId, page, pageSize, total, items]
      additionalProperties: false
      properties:
        seasonId:
          $ref: "#/components/schemas/Slug"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
          description: Total number of entries in the leaderboard.
        items:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      examples:
        - seasonId: test-fc-2000-01
          page: 1
          pageSize: 20
          total: 1
          items:
            - rank: 1
              alias: Mister Test
              misterScore: 78
              verdictKind: surpassed_history
              finishedAt: "2026-10-22T10:15:00Z"
              shareUrl: https://misterhistorico.example/r/0b6f3a52-6c0e-4d3e-8d0a-3f1f6e2b9c11

    ProductEventName:
      type: string
      description: Name of a product event.
      enum:
        - season_viewed
        - run_started
        - decision_taken
        - run_finished
        - share_clicked
        - shared_link_opened
      examples: [season_viewed]

    ProductEvent:
      type: object
      description: Anonymous product event. It carries no user identifier.
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ProductEventName"
        seasonId:
          $ref: "#/components/schemas/Slug"
        runId:
          type: string
          format: uuid
        referrer:
          type: string
          maxLength: 255
          description: Referrer host of the visit, for example `twitter.com`.
      examples:
        - name: season_viewed
          seasonId: test-fc-2000-01
          referrer: twitter.com
