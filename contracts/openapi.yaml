openapi: 3.1.0
info:
  title: Míster Histórico API
  version: 0.1.0
  summary: JSON API consumed by the Míster Histórico single-page app.
  description: |
    Contract-first definition of the game API (v0). The server is the authority: the random
    seed and the run state live in the backend, and the client only sends decisions and renders
    the `RunView` it receives.

    **Frozen after phase F1.** Any change needs a contract-change (CR) task. The TypeScript
    client in `frontend/src/infrastructure/api/generated/` is generated from this file and CI
    fails on drift.

    ## Conventions

    - Errors use `application/problem+json` (RFC 9457) and always carry a stable machine-readable
      `code`. Clients branch on `code`, never on `title` or `detail`.
    - `runId` is a UUID. Every other identifier (season, dilemma, option, player, competition,
      fixture) is a lowercase slug.
    - Request validation errors (malformed JSON, missing or invalid fields, malformed ids) are
      always `400 validation_error`. `422` is reserved for well-formed requests that break a rule
      (`invalid_option`, `invalid_key_starter`, `idempotency_key_conflict`, `alias_rejected`).
      A backend framework that defaults to 422 for validation must map it to 400.
    - **Run token.** `POST /runs` returns a secret `runToken` (opaque, server-generated, at least
      32 bytes, URL-safe). The client keeps it and sends `Authorization: Bearer <runToken>` on
      `GET /runs/{runId}`, `POST /runs/{runId}/decisions`, `POST /runs/{runId}/key-starter`,
      `POST /runs/{runId}/advance` and
      `POST /runs/{runId}/alias`. A missing token answers `401 run_token_required`, a wrong one
      `403 run_token_invalid`. `GET /runs/{runId}/result` stays public because the share link
      uses it.
    - **Optimistic locking.** `decisions`, `key-starter` and `advance` carry a mandatory
      `expectedVersion` in the body (the last `RunView.version` the client saw); a mismatch answers
      `409 version_conflict`.
    - **Idempotency.** `decisions`, `key-starter` and `advance` require an `Idempotency-Key`
      header. The same key with the same body returns the original reply even if `expectedVersion` is now stale
      and records nothing twice; the same key with another body is
      `422 idempotency_key_conflict`.
    - **Order of checks.** Every command on a run (`GET /runs/{runId}`, `decisions`,
      `key-starter`, `advance` and `alias`) evaluates, in this exact order, and stops at the first failure:
      1. malformed `runId` (not a UUID): `400 validation_error`.
      2. missing token (no `Authorization: Bearer` header): `401 run_token_required`.
      3. unknown run: `404 run_not_found`.
      4. wrong token: `403 run_token_invalid`.
      5. body validation (including the `Idempotency-Key` header and the shape of the version field):
         `400 validation_error` or `400 idempotency_key_required`.
      6. idempotent replay: the stored reply, or `422 idempotency_key_conflict`.
      7. `expectedVersion` mismatch: `409 version_conflict`.
      8. business rules: `409` and `422` codes of each operation.
    - An alias can be set only once per run; the second attempt is `409 alias_already_set`.
    - The raw option effects, the historical option of each dilemma and the seed are never
      exposed.
    - Club crests, photos and kits are never part of the API: clubs are identified by name and
      colors only (see the glossary: `GenericCrest`).

    ## Out of scope

    The public share page `GET /r/{id}` (server-rendered HTML with Open Graph tags, ADR-010) and
    the share image `GET /og/{id}.png` are not JSON endpoints for the SPA and are deliberately
    not described here. This contract only exposes their absolute URLs through
    `RunResult.shareUrl` and `RunResult.ogImageUrl`.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
    description: Same origin as the SPA (the frontend dev server proxies it to the backend).
tags:
  - name: Seasons
    description: Playable historical seasons and their context.
  - name: Runs
    description: A run is one season played by one player.
  - name: Results
    description: Final result, alias and leaderboard.
  - name: Analytics
    description: Cookie-less product events.
security: []

paths:
  /seasons:
    get:
      operationId: listSeasons
      tags: [Seasons]
      summary: List the playable seasons
      description: >-
        Returns every playable season with its club, season label, real manager and club colors.
        No crests or logos are ever returned.
      responses:
        "200":
          description: The playable seasons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonList"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /seasons/{seasonId}:
    get:
      operationId: getSeason
      tags: [Seasons]
      summary: Get the context of a season
      description: >-
        Returns the manager presentation, the board objectives, a squad summary, the competitions
        and the number of blocks of a playable season, so the player can decide whether to play it.
      parameters:
        - $ref: "#/components/parameters/SeasonId"
      responses:
        "200":
          description: The season context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /runs:
    post:
      operationId: startRun
      tags: [Runs]
      summary: Start a run
      description: >-
        Starts a new run of a playable season and returns its initial `RunView` plus the secret
        `runToken` that authorises every later command on the run. The random seed is generated
        and kept by the server and is never exposed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "201":
          description: The run was created. The `runToken` is shown only in this reply; store it.
          headers:
            Location:
              description: Relative URL of the new run.
              schema:
                type: string
                examples: [/api/runs/0b6f3a52-6c0e-4d3e-8d0a-3f1f6e2b9c11]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /runs/{runId}:
    get:
      operationId: getRun
      tags: [Runs]
      summary: Get the current state of a run
      description: >-
        Returns the `RunView`: current block, pending dilemmas, decisions taken, team state, squad
        and the summary of the last simulated block.
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /runs/{runId}/decisions:
    post:
      operationId: takeDecision
      tags: [Runs]
      summary: Take a decision
      description: >-
        Records the chosen option of a pending dilemma of the current block. The
        `Idempotency-Key` header is mandatory: repeating the same key with the same body returns
        the original reply and records nothing twice, while the same key with a different body is
        rejected with `422 idempotency_key_conflict`. The replay is evaluated before
        `expectedVersion`, which is mandatory in the body and answers `409 version_conflict` when
        stale. Requires the run token.
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeDecisionRequest"
      responses:
        "200":
          description: The decision was recorded; the updated run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /runs/{runId}/key-starter:
    post:
      operationId: selectKeyStarter
      x-implementation-task: T3.9
      tags: [Runs]
      summary: Select the key starter
      description: >-
        Contract reserved for T3.9 execution; this CR does not activate the endpoint.
        Selects one player from the current block's captured key-starter offer, for its
        exact fixture and date. Requires the run token. Shares the run-wide idempotency
        namespace with decisions and advance: authenticate, validate shape, replay the original
        reply before checking expectedVersion, then validate the offer and selection.
        A different command or body with the same key is 422 idempotency_key_conflict.
        A fresh second selection is 409 key_starter_already_selected. Invalid candidates,
        foreign, already played or mismatched fixtures are 422 invalid_key_starter.
        The response captures the selection and the forecast from block entry, without any
        future outcome or actual participation evidence.
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectKeyStarterRequest"
      responses:
        "200":
          description: The starter selection was recorded; the updated run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /runs/{runId}/advance:
    post:
      operationId: advanceBlock
      tags: [Runs]
      summary: Simulate the current block
      description: >-
        Simulates the matches of the current block and returns the `RunView` with its
        `BlockSummary`. A pending starter offer is optional: advance records it as skipped
        when no player was selected and uses the normal lineup policy, without adding RNG draws.
        This permits deploying T3.9 before the selection UI. Only unresolved dilemmas block advance.
        Answers `409 pending_dilemmas` while dilemmas are unresolved and
        `409 run_already_finished` once the run has ended. When the board confidence falls below
        the threshold the run ends with status `sacked`. Like decisions, it requires an
        `Idempotency-Key` (a replay returns the original reply and never simulates twice), a
        mandatory `expectedVersion` in the body and the run token.
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvanceBlockRequest"
      responses:
        "200":
          description: The block was simulated; the updated run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /runs/{runId}/result:
    get:
      operationId: getRunResult
      tags: [Results]
      summary: Get the final result of a run
      description: >-
        Returns the final result of a finished or sacked run: titles against the real history,
        league position against the real one, the Mister score, the verdict, the percentile and
        the share links. Answers `409 run_not_finished` while the run is in progress. Public: it
        needs no run token because the share link relies on it.
      security: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /runs/{runId}/alias:
    post:
      operationId: setAlias
      tags: [Results]
      summary: Publish a finished run under an alias
      description: >-
        Publishes a finished or sacked run in the leaderboard under a public alias (3 to 20
        characters, filtered). Answers `422 alias_rejected` when the alias is not allowed,
        `409 run_not_finished` while the run is in progress and `409 alias_already_set` when the
        run already has an alias (it can be set only once). Requires the run token.
      security:
        - runToken: []
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAliasRequest"
      responses:
        "200":
          description: The leaderboard entry of the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /leaderboards/{seasonId}:
    get:
      operationId: getLeaderboard
      tags: [Results]
      summary: Get the leaderboard of a season
      description: >-
        Returns a page of the leaderboard of a playable season, ordered by Mister score
        descending.
      parameters:
        - $ref: "#/components/parameters/SeasonId"
        - name: page
          in: query
          description: One-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: Number of entries per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of the leaderboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /events:
    post:
      operationId: sendEvent
      tags: [Analytics]
      summary: Send a product event
      description: >-
        Records an anonymous product event. No cookies, no IP address and no persistent
        identifiers are stored. The server answers `202` without a body and processes the event
        asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductEvent"
      responses:
        "202":
          description: The event was accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    runToken:
      type: http
      scheme: bearer
      description: >-
        Secret token returned once by `POST /runs`. Opaque, at least 32 bytes, URL-safe. The
        client stores it and sends it as `Authorization: Bearer <runToken>`.
  parameters:
    SeasonId:
      name: seasonId
      in: path
      required: true
      description: Slug of a playable season.
      schema:
        $ref: "#/components/schemas/Slug"
      example: test-fc-2000-01
    RunId:
      name: runId
      in: path
      required: true
      description: UUID of a run.
      schema:
        type: string
        format: uuid
      example: 0b6f3a52-6c0e-4d3e-8d0a-3f1f6e2b9c11
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated unique key (a UUID is recommended) that makes the request safe to retry.
        Keep it stable across retries of the same user action.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: 7d1c2f4e-5a6b-4c7d-8e9f-0a1b2c3d4e5f

  responses:
    BadRequest:
      description: >-
        The request is malformed: invalid JSON, a missing or invalid field, a malformed
        identifier, or a missing `Idempotency-Key` header.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://misterhistorico.example/problems/validation-error
            title: Invalid request
            status: 400
            code: validation_error
            detail: The request body is not valid.
            errors:
              - field: seasonId
                message: Required.
    Unauthorized:
      description: "The `Authorization: Bearer <runToken>` header is missing."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://misterhistorico.example/problems/run-token-required
            title: Run token required
            status: 401
            code: run_token_required
            detail: Send the run token as a Bearer token.
    Forbidden:
      description: The run token does not match the run.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://misterhistorico.example/problems/run-token-invalid
            title: Run token invalid
            status: 403
            code: run_token_invalid
            detail: The run token is not valid for this run.
    NotFound:
      description: The season or run does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://misterhistorico.example/problems/run-not-found
            title: Run not found
            status: 404
            code: run_not_found
            detail: There is no run with that id.
    Conflict:
      description: >-
        The command conflicts with the current state of the run: `version_conflict` (stale
        `expectedVersion`), `pending_dilemmas` (advancing with unresolved dilemmas),
        `dilemma_already_decided`, `run_already_finished` (the run has ended) or
        `run_not_finished` (result or alias requested too early) or `alias_already_set`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://misterhistorico.example/problems/pending-dilemmas
            title: Pending dilemmas
            status: 409
            code: pending_dilemmas
            detail: Resolve every dilemma of the block before advancing.
    UnprocessableEntity:
      description: >-
        The request is well formed but violates a rule: `invalid_option` (the option does not
        belong to the dilemma), `idempotency_key_conflict` (same key, different body) or
        `alias_rejected`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://misterhistorico.example/problems/invalid-option
            title: Invalid option
            status: 422
            code: invalid_option
            detail: The option does not belong to that dilemma.
    TooManyRequests:
      description: Rate limit exceeded. Retry after the number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
            examples: [30]
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: https://misterhistorico.example/problems/rate-limited
            title: Too many requests
            status: 429
            code: rate_limited
            detail: Slow down and retry later.

  schemas:
    Slug:
      type: string
      description: Lowercase slug identifier (letters, digits and single hyphens).
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      minLength: 1
      maxLength: 64
      examples: [test-fc-2000-01]

    ClubSeasonId:
      type: string
      description: >-
        Identifier of a club in a season. Unlike every other slug it admits the `_market-`
        prefix, reserved for the system market (`_market-<yyyy>-<yy>`), which never appears in a
        `TeamRef`. Aggregate (squad-less) rivals carry an ordinary id without underscore.
      pattern: "^(_market-)?[a-z0-9]+(-[a-z0-9]+)*$"
      minLength: 1
      maxLength: 64
      examples: [test-fc-2000-01]

    HexColor:
      type: string
      description: Color as a `#rrggbb` hex string.
      pattern: "^#[0-9a-fA-F]{6}$"
      examples: ["#1d4ed8"]

    Problem:
      type: object
      description: Problem details document (RFC 9457) with a stable machine-readable `code`.
      required: [type, title, status, code]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
          description: URI that identifies the problem type.
        title:
          type: string
          description: Short human-readable summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code.
        code:
          type: string
          description: Stable machine-readable error code. Clients branch on this value.
          enum:
            - validation_error
            - idempotency_key_required
            - run_token_required
            - run_token_invalid
            - alias_already_set
            - season_not_found
            - run_not_found
            - version_conflict
            - pending_dilemmas
            - dilemma_already_decided
            - run_already_finished
            - run_not_finished
            - invalid_option
            - invalid_key_starter
            - key_starter_already_selected
            - idempotency_key_conflict
            - alias_rejected
            - rate_limited
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI that identifies this occurrence.
        errors:
          type: array
          description: Field-level validation errors (only for `validation_error`).
          items:
            $ref: "#/components/schemas/FieldError"
      examples:
        - type: https://misterhistorico.example/problems/pending-dilemmas
          title: Pending dilemmas
          status: 409
          code: pending_dilemmas
          detail: Resolve every dilemma of the block before advancing.

    FieldError:
      type: object
      description: A validation error on one request field.
      required: [field, message]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Name of the offending field or header.
        message:
          type: string
          description: What is wrong with it.
      examples:
        - field: alias
          message: Must have between 3 and 20 characters.

    TeamColors:
      type: object
      description: Club colors used to draw the generic crest.
      required: [primary, secondary]
      additionalProperties: false
      properties:
        primary:
          $ref: "#/components/schemas/HexColor"
        secondary:
          $ref: "#/components/schemas/HexColor"
      examples:
        - primary: "#1d4ed8"
          secondary: "#f8fafc"

    SeasonSummary:
      type: object
      description: A playable season, as listed in the season picker.
      required:
        [id, clubName, shortName, seasonLabel, historicalManager, colors]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Slug"
        clubName:
          type: string
          description: Full club name.
        shortName:
          type: string
          description: Short club name.
        seasonLabel:
          type: string
          description: Season label, for example `2000-01`.
          pattern: "^[0-9]{4}-[0-9]{2}$"
        historicalManager:
          type: string
          description: Name of the real manager of that season.
        colors:
          $ref: "#/components/schemas/TeamColors"
      examples:
        - id: test-fc-2000-01
          clubName: Test FC
          shortName: TFC
          seasonLabel: 2000-01
          historicalManager: Ramon Prueba
          colors:
            primary: "#1d4ed8"
            secondary: "#f8fafc"

    SeasonList:
      type: object
      description: The playable seasons.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SeasonSummary"
      examples:
        - items:
            - id: test-fc-2000-01
              clubName: Test FC
              shortName: TFC
              seasonLabel: 2000-01
