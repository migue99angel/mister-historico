          type: integer
          minimum: 1
          description: Days the player is expected to be out.
      examples:
        - daysOut: 21

    SquadMember:
      type: object
      description: A player of the squad with his current state in the run.
      required:
        [id, displayName, position, age, rating, key, morale, fitness, injury]
      additionalProperties: false
