        - keyMatchLabel
        - userResult
      additionalProperties: false
      properties:
        fixtureId:
          $ref: "#/components/schemas/Slug"
        competitionId:
          $ref: "#/components/schemas/Slug"
        competitionName:
          type: string
        round:
          type: string
          description: Round or matchday label, for example `Matchday 7` or `Final`.
        date:
          type: string
          format: date
        home:
          $ref: "#/components/schemas/TeamRef"
        away:
          $ref: "#/components/schemas/TeamRef"
        homeGoals:
          type: integer
          minimum: 0
          description: Goals after 90 minutes.
        awayGoals:
          type: integer
          minimum: 0
          description: Goals after 90 minutes.
        extraTime:
