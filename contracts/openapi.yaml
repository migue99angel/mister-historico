          label: Sign the veteran striker

    Dilemma:
      type: object
      description: A decision the player has to take in the current block.
      required: [id, title, prompt, options]
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Slug"
        title:
          type: string
          description: Short title of the dilemma.
        prompt:
          type: string
          description: The question presented to the player.
        options:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/DilemmaOption"
      examples:
        - id: summer-striker
          title: Summer striker
          prompt: The board offers a budget for one striker. Who do you want?
          options:
            - id: sign-the-veteran
              label: Sign the veteran striker
            - id: promote-the-youth
              label: Promote the academy striker

    Decision:
      type: object
      description: A decision already taken.
      required: [dilemmaId, optionId, blockNumber]
      additionalProperties: false
      properties:
        dilemmaId:
          $ref: "#/components/schemas/Slug"
        optionId:
          $ref: "#/components/schemas/Slug"
        blockNumber:
          type: integer
          minimum: 1
