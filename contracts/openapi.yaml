      additionalProperties: false
      properties:
        seasonId:
          $ref: "#/components/schemas/Slug"
      examples:
        - seasonId: test-fc-2000-01

    StartRunResponse:
      type: object
      description: The new run and the secret token that authorises its commands.
      required: [runToken, run]
      additionalProperties: false
      properties:
        runToken:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
          description: >-
            Secret bearer token: opaque, server-generated, at least 32 bytes encoded URL-safe.
            The client stores it; it is never returned again.
        run:
          $ref: "#/components/schemas/RunView"
      examples:
        - runToken: kq3Z8mWb1xJrT0yH5sVnC2dEoPfLuA7iBgR4tYjN6Xw
          run:
            runId: 0b6f3a52-6c0e-4d3e-8d0a-3f1f6e2b9c11
            seasonId: test-fc-2000-01
            status: in_progress
            version: 0
            block:
              number: 1
              total: 5
              label: August
            pendingDilemmas:
              - id: summer-striker
                title: Summer striker
                prompt: The board offers a budget for one striker. Who do you want?
                options:
                  - id: sign-the-veteran
                    label: Sign the veteran striker
                  - id: promote-the-youth
                    label: Promote the academy striker
            decisions: []
            state:
              morale: 70
              boardConfidence: 65
              fitness: 90
            squad:
              size: 1
              averageRating: 84
              players:
                - id: ivan-delantero
                  displayName: Ivan Delantero
                  position: FW
                  age: 27
                  rating: 84
                  key: true
                  morale: 72
                  fitness: 91
                  injury: null
            tactic:
              style: balanced
              system: 4-4-2
            competitionPriorities:
              - competitionId: liga-test
                priority: normal
            lastBlockSummary: null
            sackedMonth: null

    SelectKeyStarterRequest:
      type: object
      required: [fixtureId, playerId, expectedVersion]
      additionalProperties: false
      properties:
        fixtureId:
          $ref: "#/components/schemas/Slug"
        playerId:
          $ref: "#/components/schemas/Slug"
        expectedVersion:
          type: integer
          minimum: 0

    KeyStarterOffer:
      type: object
      description: >-
        Captured once at block entry. At most one per block. Candidates are player summaries
        resolved from the captured content. No match outcome is exposed before advance.
        selectedPlayerId is null until chosen and must match a candidate ID when set.
        Two or three available reserves outside projectedStarterIds, ordered by descending
        captured effective rating and then ID. projectedStarterIds is a deterministic forecast
        computed at block entry without required players or RNG, never the actual future lineup.
        projectedStarters carries the captured player metadata in the same ID order, even after
        squad changes. No future injuries or match results are used.
        Advance without a choice explicitly skips the offer; it never blocks older clients.
      required:
        [
          blockId,
          fixtureId,
          date,
          opponent,
          competitionName,
          venue,
          keyMatchLabel,
          candidates,
          projectedStarterIds,
          projectedStarters,
          selectedPlayerId,
        ]
      additionalProperties: false
      properties:
        blockId:
          $ref: "#/components/schemas/Slug"
        fixtureId:
          $ref: "#/components/schemas/Slug"
        date:
          type: string
          format: date
        opponent:
          $ref: "#/components/schemas/TeamRef"
        competitionName:
          type: string
        venue:
          $ref: "#/components/schemas/Venue"
          description: Home, away or neutral relative to the managed team, not the opponent.
        keyMatchLabel:
          type: [string, "null"]
        candidates:
          type: array
          minItems: 2
          maxItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PlayerSummary"
        projectedStarterIds:
          type: array
          minItems: 11
          maxItems: 11
          uniqueItems: true
          description: >-
            Eleven unique predicted starter IDs captured at block entry. Candidates are outside
            this list. Known state only, without RNG; later injuries, transfers, fitness or
            decisions can change the actual lineup. This forecast is not participation evidence.
          items:
            $ref: "#/components/schemas/Slug"
        projectedStarters:
          type: array
          minItems: 11
          maxItems: 11
          uniqueItems: true
          description: >-
            Captured player details for projectedStarterIds in the same order, with unique IDs.
            Rating, position, morale, fitness and injury state are the known state at block entry,
            not predictions of future changes. Runtime validates agreement with projectedStarterIds.
          items:
            $ref: "#/components/schemas/SquadMember"
        selectedPlayerId:
          oneOf:
            - $ref: "#/components/schemas/Slug"
            - type: "null"

    KeyStarterOutcome:
      type: object
      description: >-
        Evidence captured during simulation, only published after block closure. starterIds
        is the actual managed-team lineup, including fallback. The selected player is in it
        exactly when absenceReason is null. fixture_not_played requires an empty lineup;
        every other outcome requires a nonempty lineup. Runtime validates these relations.
      required: [fixtureId, date, playerId, starterIds, absenceReason]
      additionalProperties: false
      properties:
        fixtureId:
          $ref: "#/components/schemas/Slug"
        date:
          type: string
          format: date
        playerId:
          $ref: "#/components/schemas/Slug"
        starterIds:
          type: array
          maxItems: 11
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Slug"
        absenceReason:
          oneOf:
            - type: string
              enum: [injured, not_in_squad, youth_conflict, fixture_not_played]
            - type: "null"

    TakeDecisionRequest:
      type: object
      description: The option chosen for a pending dilemma.
      required: [dilemmaId, optionId, expectedVersion]
      additionalProperties: false
      properties:
        dilemmaId:
          $ref: "#/components/schemas/Slug"
        optionId:
          $ref: "#/components/schemas/Slug"
        expectedVersion:
          type: integer
          minimum: 0
          description: Last `RunView.version` the client saw. A mismatch is `409 version_conflict`.
      examples:
        - dilemmaId: summer-striker
          optionId: sign-the-veteran
          expectedVersion: 0

    AdvanceBlockRequest:
      type: object
      description: Request to simulate the current block.
      required: [expectedVersion]
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 0
          description: Last `RunView.version` the client saw. A mismatch is `409 version_conflict`.
      examples:
        - expectedVersion: 1

    SetAliasRequest:
      type: object
      description: Public alias to publish the run under.
      required: [alias]
      additionalProperties: false
      properties:
        alias:
          type: string
          minLength: 3
          maxLength: 20
          description: Public alias, 3 to 20 characters. Filtered on the server.
      examples:
        - alias: Mister Test

    RunStatus:
      type: string
      description: >-
        `in_progress` while blocks remain, `finished` after the last block and `sacked` when the
        board dismissed the manager.
      enum: [in_progress, finished, sacked]
      examples: [in_progress]

    BlockProgress:
      type: object
      description: >-
        Position in the season. `number` is the block to play next while the run is in progress,
        and the last block played once it has ended.
      required: [number, total, label]
      additionalProperties: false
      properties:
        number:
          type: integer
          minimum: 1
          description: One-based block number.
        total:
          type: integer
          minimum: 1
          description: Number of blocks of the season.
        label:
          type: string
          description: Period covered by the block, for example `August`.
      examples:
        - number: 1
          total: 5
          label: August

    DilemmaOption:
      type: object
      description: >-
        An option of a dilemma. Effects and the historical flag are deliberately not exposed
