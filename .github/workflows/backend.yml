# Backend CI: lint, types, layer rules, tests (with Postgres via testcontainers) and coverage.
# Thresholds from PLAN §4.3: global >= 85 % (pyproject.toml) and domain + application >= 95 %.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/scripts/layer-coverage.sh"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/scripts/layer-coverage.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only superseded PR runs are cancelled; runs on main and scheduled runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: lint, types, layers and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Python and uv versions must match infra/docker/api.Dockerfile (python:3.12.15, uv 0.13.6).
      # setup-python provides the interpreter and uv picks it up.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.12.15"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory

      - name: Install dependencies
        id: sync
        run: uv sync --frozen

      # The checks below run independently of each other (as long as the install worked),
      # so a single PR reports every failure at once.
      - name: ruff check
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check .

      - name: mypy (strict)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy

      - name: Layer rules (import-linter)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run lint-imports

      # pyproject.toml already adds --cov=mister and the global fail_under = 85.
      # Docker is available on ubuntu-latest, so the integration tests run for real.
      - name: pytest
        id: tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        # Keep module-scoped PostgreSQL fixtures on one worker; report slow tests.
        run: uv run pytest -n 2 --dist loadfile --durations=25 --cov-report=xml

      - name: Coverage of domain + application (>= 95 %)
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: ../.github/scripts/layer-coverage.sh

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14
