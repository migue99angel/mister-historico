# Frontend CI: eslint + tsc + dependency-cruiser, Vitest with coverage, build, size-limit
# and Playwright E2E (Pixel 7 and iPhone 14, both on Chromium). The real-backend E2E starts
# the API with uv and a throwaway PostgreSQL container (Docker is available on the runner).
name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      # The real-backend E2E plays the backend with its golden.
      - "backend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      # The real-backend E2E plays the backend with its golden.
      - "backend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only superseded PR runs are cancelled; runs on main and scheduled runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: frontend

jobs:
  frontend:
    name: lint, tests, build, size and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Must match infra/docker/frontend.Dockerfile (node:22.23.4-bookworm-slim).
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lockfile only resolves from the public npm registry
        run: |
          if grep -n '"resolved":' package-lock.json | grep -v '"https://registry.npmjs.org/'; then
            echo "::error title=Lockfile registry::package-lock.json resolves packages outside https://registry.npmjs.org/"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Formatting (Prettier)
        run: npm run format:check

      # eslint, tsc --noEmit and dependency-cruiser (layer rules).
      - name: Lint, types and layer rules
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run size

      # The real-backend E2E serves the API from backend/ (e2e/support/real_api.py).
      # Python and uv versions match backend.yml and infra/docker/api.Dockerfile.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.15"

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.12.15"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock # relative to working-directory

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 14
