# Historical content validation (`mister content validate --release`).
# Placeholder until T2.20 creates the CLI command: it only reports that it is pending.
name: content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "backend/src/mister/catalog/**"
      - ".github/workflows/content.yml"
  pull_request:
    paths:
      - "content/**"
      - "backend/src/mister/catalog/**"
      - ".github/workflows/content.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only superseded PR runs are cancelled; runs on main and scheduled runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

