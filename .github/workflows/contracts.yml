# Contract drift: the OpenAPI generated by FastAPI must match `contracts/openapi.yaml`, and
# the TypeScript client regenerated from it must match the committed one (PLAN §4.3).
# Placeholder until T1.4 creates the contract and the generated client.
name: contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      # Covers entrypoints/api/** (the FastAPI app that generates the OpenAPI schema).
      - "backend/src/mister/entrypoints/**"
      # Published DTOs (`application/api.py`) shape the OpenAPI schema.
      - "backend/src/mister/*/application/**"
      - "frontend/src/infrastructure/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      # Covers entrypoints/api/** (the FastAPI app that generates the OpenAPI schema).
      - "backend/src/mister/entrypoints/**"
      # Published DTOs (`application/api.py`) shape the OpenAPI schema.
      - "backend/src/mister/*/application/**"
      - "frontend/src/infrastructure/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only superseded PR runs are cancelled; runs on main and scheduled runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    name: OpenAPI and TS client drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Contract drift check (placeholder)
        run: echo "OpenAPI <-> TypeScript client drift check is enabled in T1.4."
