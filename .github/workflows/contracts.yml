# Contract drift. The FastAPI conformance test (T3.6) runs in the backend workflow; this job
# covers the contract itself: it must lint, and the committed TypeScript client must be exactly
# what the contract generates (PLAN §4.3).
name: contracts

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      # Covers entrypoints/api/** (the FastAPI app that generates the OpenAPI schema).
      - "backend/src/mister/entrypoints/**"
      # Published DTOs (`application/api.py`) shape the OpenAPI schema.
      - "backend/src/mister/*/application/**"
      - "frontend/src/infrastructure/**"
      - "frontend/src/infrastructure/api/generated/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/**"
      # Covers entrypoints/api/** (the FastAPI app that generates the OpenAPI schema).
      - "backend/src/mister/entrypoints/**"
      # Published DTOs (`application/api.py`) shape the OpenAPI schema.
      - "backend/src/mister/*/application/**"
      - "frontend/src/infrastructure/**"
      - "frontend/src/infrastructure/api/generated/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only superseded PR runs are cancelled; runs on main and scheduled runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    name: OpenAPI lint and TS client drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Must match infra/docker/frontend.Dockerfile (node:22.23.4-bookworm-slim).
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint the OpenAPI contract (Redocly)
        run: npm run lint:contract

      - name: Regenerate the TypeScript client
        run: npm run gen:api

      - name: Fail if the committed client differs from the contract
        run: git diff --exit-code -- src/infrastructure/api/generated
