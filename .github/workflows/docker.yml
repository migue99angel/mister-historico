# Docker development environment: builds the compose stack, waits for every service to be
# healthy and smoke-tests the API and the frontend. Also checks that the Postgres image used
# by the migrations integration test is the one in docker-compose.yml (Dependabot only bumps
# the compose file).
name: docker

on:
  push:
    branches: [main]
    paths:
      - "infra/docker/**"
      - "docker-compose.yml"
      - ".env.example"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "infra/docker/**"
      - "docker-compose.yml"
      - ".env.example"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  # Only superseded PR runs are cancelled; runs on main and scheduled runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    name: compose build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Postgres image of the migrations test matches docker-compose.yml
        run: |
          compose_image="$(docker compose config --images | grep -E '^postgres:' || true)"
          test_image="$(grep -oE 'PostgresContainer\("[^"]+"' backend/tests/integration/test_migrations.py \
            | sed -E 's/PostgresContainer\("([^"]+)"/\1/' || true)"
          echo "docker-compose.yml: ${compose_image:-<none>}"
          echo "test_migrations.py: ${test_image:-<none>}"
          if [ -z "${compose_image}" ] || [ "${compose_image}" != "${test_image}" ]; then
            echo "::error title=Postgres image drift::Use the same image in docker-compose.yml and backend/tests/integration/test_migrations.py."
            exit 1
          fi

      - name: Build
        run: docker compose build

      - name: Start and wait for healthy services
        run: docker compose up -d --wait

      - name: API /health
        run: curl --fail --silent --show-error --retry 5 --retry-connrefused http://localhost:8000/health

      - name: Frontend
        run: curl --fail --silent --show-error --retry 5 --retry-connrefused --output /dev/null http://localhost:5173/

      - name: Logs on failure
        if: ${{ failure() }}
        run: docker compose logs --no-color

      - name: Tear down
        if: ${{ always() }}
        run: docker compose down -v
