[project]
name = "mister"
version = "0.1.0"
description = "Míster Histórico backend (FastAPI, hexagonal architecture)."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mister"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.5",
    "import-linter>=2.15",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "testcontainers[postgres]>=4.15.0",
]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return
    "PTH",      # pathlib
    "PL",       # pylint
    "RUF",      # ruff
    "S",        # bandit
    "T20",      # print
    "PT",       # pytest-style
    "TID",      # tidy-imports
    "TC",       # type-checking imports
    "ERA",      # commented-out code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how tests are written
    "S603",     # tests spawn subprocesses with controlled arguments
    "PLR2004",  # magic numbers in asserts
]

[tool.ruff.lint.isort]
known-first-party = ["mister"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.12"
# "." checks the whole backend: src, tests and the Alembic `migrations/` (owned by T0.5).
# Listing "migrations" explicitly would fail while it does not exist. mypy skips
# dot-directories such as .venv by itself.
files = ["."]
exclude = ['^mutants/', '^build/', '^dist/']
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-m", "not calibration",
    "--cov=mister",
    "--cov-report=term-missing",
]
markers = [
    "unit: unit tests without IO (default for tests outside any other level directory)",
    "integration: tests against real infrastructure (testcontainers, Postgres...)",
    "contract: port contract suites (run against the fake and the real adapter)",
    "calibration: engine Monte Carlo; slow, excluded by default (run with pytest -m calibration)",
    "content: historical content validation",
    "e2e: end-to-end tests",
]
xfail_strict = true
filterwarnings = ["error"]

# --------------------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["mister"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Global threshold (PLAN §4.3). The 95 % line + branch threshold for domain + application
# will be enforced per layer (e.g. `coverage report --include='src/mister/*/domain/*,...'
# --fail-under=95` in CI) as soon as the first context with those layers exists.
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# --------------------------------------------------------------------------- import-linter
# Layer rules from PLAN §3.2, written with wildcards so that they cover every context
# (`mister.<context>.domain`...) without touching this file when a new one is created.
# A wildcard that matches no module expands to an empty set and the contract is kept, so the
# contracts are valid even before any context exists.
# `tests/architecture/test_layer_contracts.py` applies them to a fake package with the same
# shape to prove that they really break.
[tool.importlinter]
root_packages = ["mister"]
# Required to forbid external libraries (fastapi, sqlalchemy...) in domain.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "R1 domain only imports the stdlib and shared_kernel"
type = "forbidden"
source_modules = ["mister.*.domain"]
forbidden_modules = [
    "mister.*.application",
    "mister.*.infrastructure",
    "mister.entrypoints",
    "mister.bootstrap",
    "mister.settings",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "psycopg",
    "pydantic",
    "pydantic_settings",
    "redis",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "R2 application does not import infrastructure or entrypoints"
type = "forbidden"
source_modules = ["mister.*.application"]
forbidden_modules = ["mister.*.infrastructure", "mister.entrypoints", "mister.bootstrap"]

[[tool.importlinter.contracts]]
name = "R3 infrastructure is only imported by bootstrap"
type = "protected"
protected_modules = ["mister.*.infrastructure"]
allowed_importers = ["mister.bootstrap"]

# The full R4 ("a context does not import another context's domain", not even from its
# application or infrastructure) cannot be expressed generically: import-linter has no
# "<ctx> other than <other>" wildcard. This covers the core of it (domains are independent
# of each other); the rest will be added as per-context contracts once the contexts exist.
[[tool.importlinter.contracts]]
name = "R4 domains of different contexts are independent"
type = "independence"
modules = ["mister.*.domain"]

# R5: entrypoints talk to application. Indirect imports are allowed because application
# imports domain; what is forbidden is bypassing application.
[[tool.importlinter.contracts]]
name = "R5 entrypoints do not import domain or infrastructure directly"
type = "forbidden"
source_modules = ["mister.entrypoints"]
forbidden_modules = ["mister.*.domain", "mister.*.infrastructure"]
allow_indirect_imports = true
