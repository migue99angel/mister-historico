# Alembic configuration for Míster Histórico.
#
# The database URL is NOT stored here: `migrations/env.py` reads it from the
# DATABASE_URL environment variable (format postgresql+psycopg://user:pass@host:5432/db).
#
# Revision naming convention: sequential 4-digit numeric id, with file name
# `NNNN_<slug>.py`. To create a new one:
#
#   uv run alembic revision -m "<description>" --rev-id 0002
#
# (or --autogenerate once the SQLAlchemy metadata exists). The rev-id is the
# next free number, so the migration order is readable from the file names.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
